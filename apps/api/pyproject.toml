[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hireflow-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "hireflow-domain",
    "hireflow-extract",
    "hireflow-agents",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "supabase>=2.15.0",
    "asyncpg>=0.30.0",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6.0",
    "bcrypt>=4.2.0",
    "pyjwt>=2.10.0",
    "boto3>=1.35.0",
    "arq>=0.26.0",
    "redis>=5.2.0",
    "email-validator>=2.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0"]

[tool.setuptools.packages.find]
include = ["hireflow_api*"]
