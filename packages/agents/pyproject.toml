[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hireflow-agents"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "hireflow-domain",
    "httpx>=0.27.0",
    "pydantic>=2",
]

[tool.setuptools.packages.find]
include = ["hireflow_agents*"]
