# Railway hosts the FastAPI API (apps/api), not the Next.js UI.
# UI is on Vercel. See architecture.md §8.5.

[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements-railway.txt"

[deploy]
startCommand = "uvicorn hireflow_api.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
